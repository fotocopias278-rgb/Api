services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: finai
      POSTGRES_DB: finai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Las migraciones se aplican al arrancar: la API nunca ve un esquema viejo.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finai:finai@db:5432/finai
      REDIS_URL: redis://cache:6379/0
    ports:
      - "8000:8000"
    volumes:
      - receipts_data:/app/var/receipts
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://finai:finai@db:5432/finai
      REDIS_URL: redis://cache:6379/0
    volumes:
      # El worker lee los ficheros que escribió la API: comparten volumen.
      - receipts_data:/app/var/receipts
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  receipts_data:
