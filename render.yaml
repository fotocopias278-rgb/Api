# Despliegue en Render como un ÚNICO servicio web.
#
# La extracción de comprobantes corre dentro del propio proceso web
# (RECEIPT_PROCESSING_MODE=inline) porque los planes gratuitos no ofrecen
# workers en segundo plano. Al pasar a plan de pago, añade un servicio
# `worker` con el comando de Celery y cambia el modo a `celery`.
services:
  - type: web
    name: finai-gateway
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    dockerCommand: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RECEIPT_PROCESSING_MODE
        value: inline

      # Render genera la clave de administración en el primer despliegue.
      # Consúltala en el panel: Environment -> ADMIN_API_KEYS. Con ella se dan
      # de alta los comercios; las claves de cada cliente se emiten por API.
      - key: ADMIN_API_KEYS
        generateValue: true

      # Estas tres se rellenan a mano en el panel (Postgres y Redis gestionados
      # y la clave de Anthropic). `sync: false` evita guardarlas en el repo.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Clave del proveedor de visión: basta con una de las dos.
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: RECONCILIATION_AUTO_SETTLE
        value: "false"

      # El disco de Render es efímero: en cuanto haya tráfico real, pasa a s3
      # y rellena estas cuatro. Con una sola réplica y modo inline funciona
      # igualmente en local, pero los ficheros no sobreviven a un reinicio.
      - key: RECEIPT_STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
